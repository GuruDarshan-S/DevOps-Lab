version: '3.8'

networks:
  my-bridge-net:
    driver: bridge

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - my-bridge-net

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - my-bridge-net

  flask:
    build: .
    image: flask-api:latest
    container_name: flask
    ports:
      - "5001:5001"
    networks:
      - my-bridge-net
    depends_on:
      - mysql
      - redis
